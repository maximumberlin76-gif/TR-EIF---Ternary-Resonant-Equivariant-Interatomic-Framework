name: TR-EIF Repository Naming Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-naming-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository naming contracts
        shell: bash
        run: |
          python3 <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re
          import sys


          errors: list[str] = []


          def is_ignored(path: Path) -> bool:
              """Return whether a path belongs to an ignored runtime directory."""

              return any(
                  part in {
                      "__pycache__",
                      ".git",
                  }
                  for part in path.parts
              )


          def validate_no_path_whitespace() -> None:
              """Require whitespace-free repository-controlled paths."""

              roots = (
                  Path("docs"),
                  Path("src"),
                  Path("tests"),
                  Path(".github/workflows"),
              )

              for root in roots:
                  if not root.exists():
                      continue

                  for path in root.rglob("*"):
                      if is_ignored(path):
                          continue

                      relative = path.as_posix()

                      if any(
                          character.isspace()
                          for character in relative
                      ):
                          errors.append(
                              f"{relative}: "
                              "repository-controlled paths "
                              "must not contain whitespace"
                          )


          def validate_documentation_names() -> None:
              """Validate documentation directory and chapter naming."""

              docs_root = Path("docs")

              if not docs_root.exists():
                  return

              volume_pattern = re.compile(
                  r"volume_(\d{2})_[a-z0-9_]+"
              )
              generic_directory_pattern = re.compile(
                  r"[a-z][a-z0-9_]*"
              )
              chapter_pattern = re.compile(
                  r"chapter_(\d{2})_[a-z0-9_]+\.md"
              )
              generic_markdown_pattern = re.compile(
                  r"[a-z][a-z0-9_]*\.md"
              )

              volumes: list[
                  tuple[int, Path]
              ] = []

              for path in sorted(
                  docs_root.iterdir()
              ):
                  if path.is_dir():
                      volume_match = volume_pattern.fullmatch(
                          path.name
                      )

                      if path.name.startswith(
                          "volume_"
                      ):
                          if volume_match is None:
                              errors.append(
                                  f"{path.as_posix()}: "
                                  "volume directory must match "
                                  "volume_NN_name"
                              )
                          else:
                              volumes.append(
                                  (
                                      int(
                                          volume_match.group(
                                              1
                                          )
                                      ),
                                      path,
                                  )
                              )

                      elif generic_directory_pattern.fullmatch(
                          path.name
                      ) is None:
                          errors.append(
                              f"{path.as_posix()}: "
                              "documentation directory must use "
                              "lowercase snake_case"
                          )

                  elif path.is_file():
                      if path.name == "README.md":
                          continue

                      if (
                          path.suffix == ".md"
                          and generic_markdown_pattern.fullmatch(
                              path.name
                          )
                          is None
                      ):
                          errors.append(
                              f"{path.as_posix()}: "
                              "documentation filename must use "
                              "lowercase snake_case"
                          )

              volume_numbers = tuple(
                  number
                  for number, _ in volumes
              )

              if volume_numbers:
                  expected = tuple(
                      range(
                          1,
                          len(volume_numbers) + 1,
                      )
                  )

                  if volume_numbers != expected:
                      errors.append(
                          "docs: volume numbering must be "
                          "contiguous from 01; "
                          f"found {volume_numbers}"
                      )

              for _, volume in volumes:
                  chapter_numbers: list[int] = []

                  for path in sorted(
                      volume.glob("*.md")
                  ):
                      match = chapter_pattern.fullmatch(
                          path.name
                      )

                      if match is None:
                          errors.append(
                              f"{path.as_posix()}: "
                              "volume chapter filename must match "
                              "chapter_NN_name.md"
                          )
                          continue

                      chapter_numbers.append(
                          int(
                              match.group(
                                  1
                              )
                          )
                      )

                  if chapter_numbers:
                      expected = list(
                          range(
                              1,
                              len(
                                  chapter_numbers
                              )
                              + 1,
                          )
                      )

                      if chapter_numbers != expected:
                          errors.append(
                              f"{volume.as_posix()}: "
                              "chapter numbering must be "
                              "contiguous from 01; "
                              f"found {tuple(chapter_numbers)}"
                          )


          def validate_source_names() -> None:
              """Validate Python package and module naming."""

              source_root = Path(
                  "src/tr_eif"
              )

              if not source_root.exists():
                  return

              identifier_pattern = re.compile(
                  r"[a-z][a-z0-9_]*"
              )
              module_pattern = re.compile(
                  r"[a-z][a-z0-9_]*\.py"
              )

              for path in source_root.rglob(
                  "*"
              ):
                  if is_ignored(path):
                      continue

                  if path.is_dir():
                      if identifier_pattern.fullmatch(
                          path.name
                      ) is None:
                          errors.append(
                              f"{path.as_posix()}: "
                              "Python package directory must use "
                              "lowercase snake_case"
                          )

                  elif (
                      path.is_file()
                      and path.suffix == ".py"
                      and path.name != "__init__.py"
                  ):
                      if module_pattern.fullmatch(
                          path.name
                      ) is None:
                          errors.append(
                              f"{path.as_posix()}: "
                              "Python module filename must use "
                              "lowercase snake_case"
                          )


          def validate_test_names() -> None:
              """Validate test directory and module naming."""

              tests_root = Path(
                  "tests"
              )

              if not tests_root.exists():
                  return

              directory_pattern = re.compile(
                  r"[a-z][a-z0-9_]*"
              )
              test_pattern = re.compile(
                  r"test_[a-z0-9_]+\.py"
              )

              for path in tests_root.rglob(
                  "*"
              ):
                  if is_ignored(path):
                      continue

                  if path.is_dir():
                      if directory_pattern.fullmatch(
                          path.name
                      ) is None:
                          errors.append(
                              f"{path.as_posix()}: "
                              "test directory must use "
                              "lowercase snake_case"
                          )

                  elif (
                      path.is_file()
                      and path.suffix == ".py"
                      and path.name != "__init__.py"
                  ):
                      if test_pattern.fullmatch(
                          path.name
                      ) is None:
                          errors.append(
                              f"{path.as_posix()}: "
                              "test module filename must match "
                              "test_name.py"
                          )


          def validate_workflow_names() -> None:
              """Validate GitHub Actions workflow filenames."""

              workflow_root = Path(
                  ".github/workflows"
              )

              if not workflow_root.exists():
                  return

              workflow_pattern = re.compile(
                  r"[a-z][a-z0-9-]*\.ya?ml"
              )

              for path in workflow_root.iterdir():
                  if not path.is_file():
                      continue

                  if path.suffix not in {
                      ".yml",
                      ".yaml",
                  }:
                      continue

                  if workflow_pattern.fullmatch(
                      path.name
                  ) is None:
                      errors.append(
                          f"{path.as_posix()}: "
                          "workflow filename must use "
                          "lowercase kebab-case"
                      )


          validate_no_path_whitespace()
          validate_documentation_names()
          validate_source_names()
          validate_test_names()
          validate_workflow_names()

          if errors:
              print(
                  "Repository naming validation failed:"
              )

              for error in errors:
                  print(
                      f"- {error}"
                  )

              sys.exit(
                  1
              )

          print(
              "Repository naming validation passed."
          )
          PY
