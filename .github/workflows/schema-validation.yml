name: TR-EIF Schema Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-validation:
    name: TR-EIF Complete Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prepare validation artifacts
        run: |
          mkdir -p artifacts

      - name: Validate complete committed schema contract
        run: |
          python -m pytest \
            tests/invariants/test_configuration_schema_contract.py \
            tests/invariants/test_root_schema_set_contract.py \
            -q \
            --junitxml=artifacts/schema-validation.xml

      - name: Upload schema validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tr-eif-schema-validation-report
          path: artifacts/schema-validation.xml
          if-no-files-found: ignore
