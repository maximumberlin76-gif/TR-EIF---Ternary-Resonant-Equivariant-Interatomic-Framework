name: TR-EIF Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: TR-EIF Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile package
        run: |
          python -m compileall -q src/tr_eif

      - name: Import public package layers
        run: |
          python - <<'PY'
          import tr_eif
          import tr_eif.energy
          import tr_eif.equivariant
          import tr_eif.flibe
          import tr_eif.geometry
          import tr_eif.graph
          import tr_eif.md
          import tr_eif.multiscale
          import tr_eif.observables
          import tr_eif.resonance
          import tr_eif.ternary

          print("TR-EIF smoke test: PASS")
          PY

  structured-output:
    name: TR-EIF Structured Output
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prepare validation artifacts
        run: |
          mkdir -p artifacts

      - name: Run structured output qualification
        run: |
          python -m pytest \
            tests/determinism/test_trace_file_export.py \
            tests/invariants/test_trace_schema_contract.py \
            -q \
            --junitxml=artifacts/structured-output.xml

      - name: Upload structured output report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tr-eif-structured-output-report
          path: artifacts/structured-output.xml
          if-no-files-found: ignore

  deterministic-bench:
    name: TR-EIF Deterministic Validation Bench
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prepare validation artifacts
        run: |
          mkdir -p artifacts

      - name: Run deterministic validation bench
        run: |
          python -m pytest \
            tests/determinism \
            tests/equivariance \
            tests/conservation \
            tests/numerical \
            -q \
            --junitxml=artifacts/deterministic-validation-bench.xml

      - name: Upload deterministic validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tr-eif-deterministic-validation-report
          path: artifacts/deterministic-validation-bench.xml
          if-no-files-found: ignore

  self-test:
    name: TR-EIF Self Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prepare validation artifacts
        run: |
          mkdir -p artifacts

      - name: Run complete repository test suite
        run: |
          python -m pytest \
            -q \
            --junitxml=artifacts/full-self-test.xml

      - name: Upload full self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tr-eif-full-self-test-report
          path: artifacts/full-self-test.xml
          if-no-files-found: ignore
